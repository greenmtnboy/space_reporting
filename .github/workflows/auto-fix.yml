# Answer an `auto-fix` issue with a pull request.
#
# The other half of the pipeline's failure handler. When the scheduled
# refresh fails on trilogy-cloud, `data/on_failure.py` (run by the
# `space-on-failure` job, see `[dependencies]` in data/trilogy.toml) opens an
# issue here labelled `auto-fix`. That label is what this workflow listens
# for: Claude reads the issue, reproduces the failure with the credential-free
# ingest scripts, fixes it on a branch and opens a PR that references the
# issue. Merging the PR redeploys `data/` through cloud-sync.yml, and the next
# 06:00 UTC tick verifies it.
#
# The handler files one issue per failure *episode* — repeat failures comment
# on the open issue instead of opening another — so this runs once per
# episode. Re-apply the label (remove, add) to run it again by hand.
#
# Needs `ANTHROPIC_API_KEY` in the repository secrets. The PR is opened with
# the workflow's own GITHUB_TOKEN, so it does not trigger the Playwright CI
# run on its own; push an empty commit or close/reopen the PR if you want that
# before merging.

name: Auto-fix

on:
  issues:
    types: [labeled]

concurrency:
  group: auto-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    name: Fix issue with Claude
    if: github.event.label.name == 'auto-fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Fix with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Issue #${{ github.event.issue.number }} was opened automatically
            because the scheduled data refresh failed. Fix it.

            Issue title: ${{ github.event.issue.title }}
            Issue body:
            ${{ github.event.issue.body }}

            How to work:
            1. Read data/trilogy.toml, data/refresh.preql and the ingest
               scripts under data/raw/. Each data/raw/ingest_*.py is a
               standalone `uv run` script that downloads one GCAT table and
               validates its column layout; run the ones the issue points at
               (`uv run data/raw/ingest_<table>.py > /dev/null`) to
               reproduce the failure. No credentials are needed for that.
            2. Find the root cause. The usual one is the upstream TSV
               changing shape, fixed by updating the `Layout` in the ingest
               script (headers and numeric columns) to the column reference
               linked at the top of that script, and keeping the matching
               datasource in data/raw/*.preql in step.
            3. Make the smallest correct fix, rerun the ingest script(s) to
               show they now emit rows, and commit on a new branch named
               claude/auto-fix-${{ github.event.issue.number }}.
            4. Push the branch and open a pull request against main with
               `gh pr create`. The PR body must say what changed and why and
               end with `Fixes #${{ github.event.issue.number }}`.
            5. If you cannot reproduce or fix it, do not open a PR: comment on
               the issue with what you found instead.
          claude_args: >-
            --max-turns 40
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(uv:*),Bash(git:*),Bash(gh pr create:*),Bash(gh issue comment:*),Bash(gh pr view:*)"
